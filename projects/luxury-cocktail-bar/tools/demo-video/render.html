<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Demo scene renderer</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
/*
 * Renderer procedurale delle 3 scene DEMO (segnaposto dei video reali).
 * Uso: render.mjs chiama window.renderFrame(scene, t) con t in [0,1]
 * e cattura il canvas fotogramma per fotogramma.
 * Le coordinate finali degli ingredienti della scena 2 coincidono con
 * i data-x / data-y delle etichette in index.html.
 */
const W = 1280, H = 720;
const c = document.getElementById('c');
const ctx = c.getContext('2d');

const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutExpo = t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const smooth = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };

function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- Sfondo comune: nero caldo, bagliore ambra, bokeh ---------- */
const BOKEH = (() => {
  const r = rng(7); const out = [];
  for (let i = 0; i < 38; i++) {
    out.push({ x: r() * W, y: r() * H, r: 8 + r() * 46, a: 0.04 + r() * 0.12, s: 0.3 + r(), hue: r() });
  }
  return out;
})();

function background(t, glowX = W / 2, glowY = H * 0.55, glow = 1) {
  ctx.fillStyle = '#060504';
  ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, 620);
  g.addColorStop(0, `rgba(150,90,30,${0.42 * glow})`);
  g.addColorStop(0.45, `rgba(70,38,12,${0.28 * glow})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.filter = 'blur(6px)';
  for (const b of BOKEH) {
    const x = (b.x + t * 60 * b.s) % (W + 100) - 50;
    const y = b.y + Math.sin(t * TAU + b.x) * 10;
    ctx.fillStyle = b.hue > 0.7 ? `rgba(255,200,140,${b.a})` : `rgba(220,150,60,${b.a})`;
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function vignette() {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.85)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ---------- Bicchiere old fashioned in cristallo intagliato ---------- */
function drawGlass({ cx, top, bottom, R, rot, liquid = 0.55, ice = true, alpha = 1 }) {
  const ry = R * 0.2;
  const Rb = R * 0.9;
  ctx.save();
  ctx.globalAlpha = alpha;

  // riflesso sul banco
  const sh = ctx.createRadialGradient(cx, bottom + 6, 0, cx, bottom + 6, R * 1.8);
  sh.addColorStop(0, 'rgba(230,150,60,0.35)');
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath(); ctx.ellipse(cx, bottom + 8, R * 1.8, ry * 1.6, 0, 0, TAU); ctx.fill();

  // parete posteriore
  ctx.strokeStyle = 'rgba(255,235,205,0.22)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(cx, top, R, ry, 0, Math.PI, TAU); ctx.stroke();

  // liquido
  const ly = lerp(bottom - 18, top, liquid);
  const lr = lerp(Rb, R, liquid);
  const lg = ctx.createLinearGradient(0, ly, 0, bottom);
  lg.addColorStop(0, 'rgba(226,140,45,0.92)');
  lg.addColorStop(0.6, 'rgba(160,80,18,0.92)');
  lg.addColorStop(1, 'rgba(80,36,6,0.95)');
  ctx.fillStyle = lg;
  ctx.beginPath();
  ctx.moveTo(cx - lr, ly);
  ctx.lineTo(cx - Rb + 2, bottom - 18);
  ctx.ellipse(cx, bottom - 18, Rb - 2, ry * 0.9, 0, Math.PI, 0, true);
  ctx.lineTo(cx + lr, ly);
  ctx.ellipse(cx, ly, lr, ry, 0, 0, Math.PI, false);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,190,110,0.55)';
  ctx.beginPath(); ctx.ellipse(cx, ly, lr, ry, 0, 0, TAU); ctx.fill();

  // cubo di ghiaccio che ruota con il bicchiere
  if (ice) drawIceCube(cx, ly + 4, R * 0.42, rot * 0.8, 0.35, 0.9);

  // sfaccettature
  const N = 16;
  for (let k = 0; k < N; k++) {
    const th = (k / N) * TAU + rot;
    const z = Math.cos(th);
    if (z < 0) continue;
    const x1 = cx + Math.sin(th) * R;
    const x2 = cx + Math.sin(th) * Rb;
    const spec = Math.pow(Math.max(0, Math.sin(th + 0.6)), 8);
    ctx.strokeStyle = `rgba(255,240,215,${0.08 + z * 0.18 + spec * 0.55})`;
    ctx.lineWidth = 1 + spec * 2.5;
    ctx.beginPath(); ctx.moveTo(x1, top + ry * z); ctx.lineTo(x2, bottom - 18 + ry * z); ctx.stroke();
  }

  // bordi laterali
  const edge = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
  edge.addColorStop(0, 'rgba(255,240,220,0.75)');
  edge.addColorStop(0.15, 'rgba(255,240,220,0.08)');
  edge.addColorStop(0.85, 'rgba(255,240,220,0.08)');
  edge.addColorStop(1, 'rgba(255,240,220,0.6)');
  ctx.strokeStyle = edge;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - R, top); ctx.lineTo(cx - Rb, bottom - 18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + R, top); ctx.lineTo(cx + Rb, bottom - 18); ctx.stroke();

  // fondo spesso
  const base = ctx.createLinearGradient(0, bottom - 22, 0, bottom);
  base.addColorStop(0, 'rgba(255,220,170,0.35)');
  base.addColorStop(1, 'rgba(255,220,170,0.08)');
  ctx.fillStyle = base;
  ctx.beginPath();
  ctx.ellipse(cx, bottom - 18, Rb, ry * 0.9, 0, 0, Math.PI);
  ctx.lineTo(cx - Rb, bottom);
  ctx.ellipse(cx, bottom, Rb, ry * 0.9, 0, Math.PI, 0, true);
  ctx.closePath();
  ctx.fill();

  // bordo anteriore
  ctx.strokeStyle = 'rgba(255,240,215,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(cx, top, R, ry, 0, 0, Math.PI); ctx.stroke();

  // lampo speculare verticale
  const sx = cx + Math.sin(rot * 0.5) * R * 0.15 - R * 0.55;
  const sp = ctx.createLinearGradient(sx - 10, 0, sx + 10, 0);
  sp.addColorStop(0, 'rgba(255,255,255,0)');
  sp.addColorStop(0.5, 'rgba(255,250,240,0.35)');
  sp.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sp;
  ctx.fillRect(sx - 10, top + 10, 20, bottom - top - 40);
  ctx.restore();
}

function drawIceCube(cx, cy, s, rotY, rotX, alpha = 1) {
  const v = [];
  for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) {
    let X = x * s / 2, Y = y * s / 2, Z = z * s / 2;
    let x1 = X * Math.cos(rotY) + Z * Math.sin(rotY);
    let z1 = -X * Math.sin(rotY) + Z * Math.cos(rotY);
    let y1 = Y * Math.cos(rotX) - z1 * Math.sin(rotX);
    let z2 = Y * Math.sin(rotX) + z1 * Math.cos(rotX);
    v.push([cx + x1, cy + y1, z2]);
  }
  const faces = [[0, 1, 3, 2], [4, 5, 7, 6], [0, 1, 5, 4], [2, 3, 7, 6], [0, 2, 6, 4], [1, 3, 7, 5]];
  const sorted = faces.map(f => ({ f, z: f.reduce((a, i) => a + v[i][2], 0) / 4 })).sort((a, b) => a.z - b.z);
  ctx.save();
  ctx.globalAlpha *= alpha;
  for (const { f, z } of sorted) {
    ctx.beginPath();
    f.forEach((i, k) => (k ? ctx.lineTo(v[i][0], v[i][1]) : ctx.moveTo(v[i][0], v[i][1])));
    ctx.closePath();
    ctx.fillStyle = `rgba(235,245,255,${0.06 + clamp(z / s + 0.5) * 0.14})`;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,250,240,0.5)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawOrangePeel(x, y, s, rot, alpha = 1) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.lineCap = 'round';
  const g = ctx.createLinearGradient(-s, 0, s, 0);
  g.addColorStop(0, '#b4500c'); g.addColorStop(0.5, '#f29a2e'); g.addColorStop(1, '#c2600f');
  ctx.strokeStyle = g;
  ctx.lineWidth = s * 0.28;
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const u = i / 40;
    const px = lerp(-s, s, u);
    const py = Math.sin(u * TAU * 1.25) * s * 0.28;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,230,170,0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawCherry(x, y, s, rot, alpha = 1) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.strokeStyle = '#5a3a14'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, -s * 0.6); ctx.quadraticCurveTo(s * 0.3, -s * 1.4, s * 0.8, -s * 1.7); ctx.stroke();
  const g = ctx.createRadialGradient(-s * 0.3, -s * 0.3, s * 0.1, 0, 0, s);
  g.addColorStop(0, '#d23a3a'); g.addColorStop(0.6, '#6d0b14'); g.addColorStop(1, '#2a0306');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, s * 0.75, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,220,220,0.55)';
  ctx.beginPath(); ctx.ellipse(-s * 0.28, -s * 0.3, s * 0.16, s * 0.09, -0.6, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawGoldLeaf(x, y, s, rot, alpha = 1) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(1, 0.55 + Math.abs(Math.sin(rot * 2)) * 0.45);
  const g = ctx.createLinearGradient(-s, -s, s, s);
  g.addColorStop(0, '#8a6420'); g.addColorStop(0.45, '#f6dc8c'); g.addColorStop(0.55, '#fff3c4'); g.addColorStop(1, '#a87a2a');
  ctx.fillStyle = g;
  ctx.beginPath();
  const pts = [[-1, -0.6], [-0.2, -1], [0.7, -0.7], [1, 0.1], [0.5, 0.9], [-0.4, 0.8], [-0.9, 0.3]];
  pts.forEach(([px, py], i) => (i ? ctx.lineTo(px * s, py * s) : ctx.moveTo(px * s, py * s)));
  ctx.closePath(); ctx.fill();
  ctx.shadowColor = 'rgba(255,210,120,0.8)'; ctx.shadowBlur = 20;
  ctx.strokeStyle = 'rgba(255,240,190,0.6)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function drawDrops(x, y, s, t, alpha = 1) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  const offs = [[0, 0, 1], [-s * 0.9, s * 0.7, 0.65], [s * 0.8, s * 0.9, 0.5]];
  for (const [dx, dy, k] of offs) {
    const px = x + dx, py = y + dy + Math.sin(t * TAU + dx) * 3;
    const r = s * 0.45 * k;
    const g = ctx.createRadialGradient(px - r * 0.3, py - r * 0.2, 0, px, py, r * 1.6);
    g.addColorStop(0, 'rgba(200,60,30,0.95)'); g.addColorStop(1, 'rgba(70,10,5,0.9)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(px, py - r * 1.8);
    ctx.bezierCurveTo(px + r * 1.1, py - r * 0.4, px + r, py + r, px, py + r);
    ctx.bezierCurveTo(px - r, py + r, px - r * 1.1, py - r * 0.4, px, py - r * 1.8);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,220,200,0.6)';
    ctx.beginPath(); ctx.arc(px - r * 0.3, py - r * 0.1, r * 0.18, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

/* ---------- Particelle d'oro in orbita 3D ---------- */
const ORBIT = (() => {
  const r = rng(21); const out = [];
  for (let i = 0; i < 90; i++) out.push({ a: r() * TAU, rad: 170 + r() * 160, y: (r() - 0.5) * 260, s: 0.6 + r() * 2.2, sp: 0.6 + r() * 0.8 });
  return out;
})();

function drawOrbit(cx, cy, rot, front, scale) {
  for (const p of ORBIT) {
    const a = p.a + rot * p.sp;
    const z = Math.cos(a);
    if ((z > 0) !== front) continue;
    const x = cx + Math.sin(a) * p.rad * scale;
    const y = cy + p.y * scale * 0.6 + z * 30;
    const sz = p.s * (1.2 + z * 0.6) * scale;
    ctx.fillStyle = `rgba(255,${200 + z * 30 | 0},${120 + z * 40 | 0},${0.35 + (z + 1) * 0.3})`;
    ctx.shadowColor = 'rgba(255,190,90,0.9)';
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(x, y, sz, 0, TAU); ctx.fill();
  }
  ctx.shadowBlur = 0;
}

/* =========================================================
 * SCENA 1 — spin: il bicchiere ruota a 360° con scorza in orbita
 * ========================================================= */
function scene1(t) {
  const rot = easeInOut(t) * TAU;
  const scale = lerp(1, 1.12, t);
  background(t, W / 2, H * 0.6, 1);
  ctx.save();
  ctx.translate(W / 2, H * 0.58);
  ctx.scale(scale, scale);
  ctx.translate(-W / 2, -H * 0.58);
  drawOrbit(W / 2, H * 0.52, rot, false, 1);
  const ga = rot + Math.PI * 0.25;
  const gz = Math.cos(ga);
  const peel = () => drawOrangePeel(W / 2 + Math.sin(ga) * 150, 265 + gz * 22, 48, Math.sin(ga) * 0.6 - 0.3);
  if (gz < 0) peel();
  drawGlass({ cx: W / 2, top: 260, bottom: 560, R: 150, rot });
  if (gz >= 0) peel();
  drawOrbit(W / 2, H * 0.52, rot, true, 1);
  ctx.restore();
  // lens flare orizzontale
  const fl = ctx.createLinearGradient(0, 0, W, 0);
  const fx = 0.5 + Math.sin(rot) * 0.15;
  fl.addColorStop(clamp(fx - 0.2), 'rgba(255,190,110,0)');
  fl.addColorStop(fx, 'rgba(255,200,130,0.16)');
  fl.addColorStop(clamp(fx + 0.2), 'rgba(255,190,110,0)');
  ctx.fillStyle = fl;
  ctx.fillRect(0, 300, W, 3);
  vignette();
}

/* =========================================================
 * SCENA 2 — esplosione: gli ingredienti escono dal bicchiere
 * e restano sospesi. Posizioni finali = data-x/data-y in index.html
 * ========================================================= */
const INGREDIENTS = [
  { kind: 'ice',    x: 360, y: 210, s: 70, spin: 1.3 },
  { kind: 'peel',   x: 930, y: 190, s: 62, spin: -0.9 },
  { kind: 'cherry', x: 330, y: 480, s: 34, spin: 0.7 },
  { kind: 'gold',   x: 960, y: 455, s: 34, spin: 1.6 },
  { kind: 'drops',  x: 640, y: 105, s: 26, spin: 0 },
];
const ORB = { x: 640, y: 330, r: 64 };
const SPLASH = (() => {
  const r = rng(99); const out = [];
  for (let i = 0; i < 140; i++) out.push({ a: -Math.PI / 2 + (r() - 0.5) * Math.PI * 1.6, v: 120 + r() * 520, s: 1 + r() * 4, d: r() });
  return out;
})();

function scene2(t) {
  background(t, W / 2, H * 0.5, 0.9);
  const gx = W / 2, gTop = 500, gBot = 650;
  const burst = smooth(0.12, 0.7, t);
  const fly = easeOutExpo(clamp((t - 0.12) / 0.6));
  const shake = t < 0.12 ? Math.sin(t * 400) * 2 * (t / 0.12) : 0;

  // schizzi di liquido
  if (t > 0.12) {
    const k = clamp((t - 0.12) / 0.7);
    for (const p of SPLASH) {
      const dist = p.v * (1 - Math.pow(1 - k, 3));
      const x = gx + Math.cos(p.a) * dist;
      const y = gTop + Math.sin(p.a) * dist + k * k * 60;
      const a = (1 - k) * 0.9 * (0.4 + p.d);
      ctx.fillStyle = `rgba(230,140,50,${a})`;
      ctx.beginPath(); ctx.arc(x, y, p.s, 0, TAU); ctx.fill();
    }
  }

  // sfera di liquido sospesa
  const orbK = smooth(0.15, 0.6, t);
  if (orbK > 0) {
    const oy = lerp(gTop, ORB.y, easeOutExpo(orbK)) + Math.sin(t * TAU * 1.5) * 4 * orbK;
    const or = ORB.r * orbK;
    const og = ctx.createRadialGradient(ORB.x - or * 0.35, oy - or * 0.35, or * 0.1, ORB.x, oy, or);
    og.addColorStop(0, 'rgba(255,205,130,0.98)');
    og.addColorStop(0.5, 'rgba(210,120,35,0.95)');
    og.addColorStop(1, 'rgba(90,40,8,0.95)');
    ctx.save();
    ctx.shadowColor = 'rgba(255,160,60,0.6)'; ctx.shadowBlur = 50;
    ctx.fillStyle = og;
    ctx.beginPath();
    for (let i = 0; i <= 48; i++) {
      const a = (i / 48) * TAU;
      const wob = 1 + Math.sin(a * 3 + t * 20) * 0.04 * orbK + Math.sin(a * 5 - t * 14) * 0.02;
      const x = ORB.x + Math.cos(a) * or * wob, y = oy + Math.sin(a) * or * wob;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,245,220,0.55)';
    ctx.beginPath(); ctx.ellipse(ORB.x - or * 0.35, oy - or * 0.4, or * 0.22, or * 0.12, -0.6, 0, TAU); ctx.fill();
  }

  drawGlass({ cx: gx + shake, top: gTop, bottom: gBot, R: 95, rot: t * 1.2, liquid: lerp(0.55, 0.12, burst), ice: t < 0.14 });

  for (const ing of INGREDIENTS) {
    const bob = Math.sin(t * TAU * 1.2 + ing.x) * 5 * fly;
    const x = lerp(gx, ing.x, fly);
    const y = lerp(gTop - 10, ing.y, fly) + bob;
    const rot = ing.spin * (fly * 2.4 + t * 0.6);
    const a = t < 0.12 ? 0 : clamp((t - 0.12) * 10);
    if (ing.kind === 'ice') drawIceCube(x, y, ing.s, rot, 0.5 + rot * 0.3, a);
    if (ing.kind === 'peel') drawOrangePeel(x, y, ing.s, rot * 0.5, a);
    if (ing.kind === 'cherry') drawCherry(x, y, ing.s, rot * 0.3, a);
    if (ing.kind === 'gold') drawGoldLeaf(x, y, ing.s, rot, a);
    if (ing.kind === 'drops') drawDrops(x, y, ing.s, t, a);
    // alone
    const h = ctx.createRadialGradient(x, y, 0, x, y, ing.s * 2.2);
    h.addColorStop(0, `rgba(255,190,100,${0.12 * a})`); h.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = h; ctx.beginPath(); ctx.arc(x, y, ing.s * 2.2, 0, TAU); ctx.fill();
  }
  vignette();
}

/* =========================================================
 * SCENA 3 — fly-through: la camera attraversa il locale
 * (archi in ottone, lampade sospese, scaffali di bottiglie)
 * ========================================================= */
const F = 620;
const WORLD = (() => {
  const r = rng(3);
  const arches = [], lamps = [], bottles = [];
  for (let z = 4; z < 60; z += 6) arches.push(z);
  for (let z = 2; z < 60; z += 3.2) lamps.push({ z, x: (Math.round(z / 3.2) % 2 ? 1.4 : -1.4), drop: 1.6 + r() * 0.5 });
  for (let z = 1; z < 60; z += 0.45) {
    for (const side of [-1, 1]) {
      for (const shelf of [0.2, -0.9, -2.0]) {
        if (r() < 0.25) continue;
        bottles.push({ z: z + r() * 0.3, x: side * 3.4, y: shelf, h: 0.55 + r() * 0.45, hue: r(), side });
      }
    }
  }
  return { arches, lamps, bottles };
})();

function proj(x, y, z, cam) {
  const zz = z - cam.z;
  return { x: W / 2 + ((x - cam.x) * F) / zz, y: H / 2 + ((y - cam.y) * F) / zz, s: F / zz, z: zz };
}
const fog = z => clamp(1 - z / 38) * clamp((z - 0.35) / 0.8);

function scene3(t) {
  const e = easeInOut(t);
  const cam = { z: e * 34, x: Math.sin(t * Math.PI) * 0.35, y: -0.2 + Math.sin(t * TAU) * 0.06 };
  background(t, W / 2, H * 0.48, 0.7 + t * 0.6);

  // pavimento lucido con linee prospettiche
  ctx.save();
  for (let i = -6; i <= 6; i++) {
    const a = proj(i * 0.9, 2.2, cam.z + 0.5, cam), b = proj(i * 0.9, 2.2, cam.z + 60, cam);
    ctx.strokeStyle = 'rgba(200,140,70,0.07)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.restore();

  // fondo: porta luminosa
  const end = proj(0, -0.6, 64, cam);
  const eg = ctx.createRadialGradient(end.x, end.y, 0, end.x, end.y, 60 + t * 260);
  eg.addColorStop(0, 'rgba(255,215,150,0.9)');
  eg.addColorStop(0.3, 'rgba(240,160,70,0.35)');
  eg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = eg;
  ctx.fillRect(0, 0, W, H);

  const items = [];
  for (const b of WORLD.bottles) if (b.z - cam.z > 0.3) items.push({ z: b.z, draw: () => drawBottle(b, cam) });
  for (const a of WORLD.arches) if (a - cam.z > 0.3) items.push({ z: a, draw: () => drawArch(a, cam) });
  for (const l of WORLD.lamps) if (l.z - cam.z > 0.3) items.push({ z: l.z, draw: () => drawLamp(l, cam) });
  items.sort((a, b) => b.z - a.z).forEach(i => i.draw());
  vignette();
}

function drawArch(z, cam) {
  const p = proj(0, 0, z, cam);
  const f = fog(p.z);
  if (f <= 0) return;
  const hw = 3.9 * p.s, top = (-3.0 - cam.y) * p.s + H / 2, bot = (2.2 - cam.y) * p.s + H / 2;
  const cx = p.x;
  ctx.save();
  ctx.strokeStyle = `rgba(200,155,85,${0.75 * f})`;
  ctx.shadowColor = `rgba(255,190,100,${0.6 * f})`;
  ctx.shadowBlur = 12;
  ctx.lineWidth = Math.max(1, 0.09 * p.s);
  ctx.beginPath();
  ctx.moveTo(cx - hw, bot);
  ctx.lineTo(cx - hw, top + hw * 0.5);
  ctx.quadraticCurveTo(cx - hw, top - hw * 0.35, cx, top - hw * 0.35);
  ctx.quadraticCurveTo(cx + hw, top - hw * 0.35, cx + hw, top + hw * 0.5);
  ctx.lineTo(cx + hw, bot);
  ctx.stroke();
  ctx.restore();
}

function drawLamp(l, cam) {
  const p = proj(l.x, -3 + l.drop, l.z, cam);
  const f = fog(p.z);
  if (f <= 0) return;
  const cord = proj(l.x, -4.5, l.z, cam);
  ctx.strokeStyle = `rgba(160,120,70,${0.5 * f})`;
  ctx.lineWidth = Math.max(0.5, 0.015 * p.s);
  ctx.beginPath(); ctx.moveTo(cord.x, cord.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  const r = 0.16 * p.s;
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 6);
  g.addColorStop(0, `rgba(255,235,190,${f})`);
  g.addColorStop(0.15, `rgba(255,190,100,${0.8 * f})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 6, 0, TAU); ctx.fill();
}

function drawBottle(b, cam) {
  const p = proj(b.x, b.y, b.z, cam);
  const f = fog(p.z);
  if (f <= 0) return;
  const w = 0.16 * p.s, h = b.h * p.s;
  const col = b.hue < 0.45 ? [210, 120, 40] : b.hue < 0.7 ? [70, 120, 60] : b.hue < 0.85 ? [150, 40, 40] : [230, 220, 200];
  ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${0.55 * f})`;
  ctx.fillRect(p.x - w / 2, p.y - h, w, h * 0.72);
  ctx.fillRect(p.x - w / 6, p.y - h * 1.18, w / 3, h * 0.3);
  ctx.fillStyle = `rgba(255,230,190,${0.45 * f})`;
  ctx.fillRect(p.x - w / 2 + w * 0.15, p.y - h * 0.95, Math.max(1, w * 0.12), h * 0.6);
  // mensola
  ctx.fillStyle = `rgba(180,135,70,${0.25 * f})`;
  ctx.fillRect(p.x - w, p.y, w * 2.2, Math.max(1, 0.03 * p.s));
}

window.renderFrame = (scene, t) => {
  ctx.clearRect(0, 0, W, H);
  ({ 1: scene1, 2: scene2, 3: scene3 })[scene](t);
};
window.renderFrame(1, 0);
</script>
</body>
